# ============================================================
# config_fw.yaml — fw: prior + self-feedback 输入分支 (teacher forcing)
#   输入 = [prior(t) | x_f*m | m],  x_f = GT(t-1),  base = prior(t), R=1
#
# 相对 config_prior.yaml (1b) 只多一个变量: 自反馈支路 + conditioning dropout。
# prior / schema / stats / 划分 / 模型超参全部照抄 —— 单变量对照。
# ============================================================
data:
  dir: ${oc.env:HOME}/hpc-share/models/data/3d/cropped_0.05
  # 逐 chunk t-offset 标定后重新生成 (fwv/toffset_scan/c00*.json -> gen_prior.sh)。
  # 旧的固定 t=0.15 版本在 .../3d/prior_t015, 保留作对照 arm。
  prior_dir: ${oc.env:HOME}/hpc-share/models/data/3d/cropped_0.05/prior_ktuned

  # chunk 9 的 prior 此前失效 (固定 offset 下 raw 空间 Uz nRMSE=1.02 > 1)。
  # 逐 chunk 标定发现它的最优 k=+6 而非 +3 —— 那是配准误差, 不是数据问题。
  # 重新生成后 Uz nRMSE=0.957 < 1, chunk 9 已是有效 test chunk。
  # 划分仍保持 train 1-7 / val 8 / test 9 (与旧 arm 可比, 单变量)。
  train_chunk_range: [1, 7]
  val_chunk_range: [8]
  test_chunk_range: [9]

  # window=0 : 无时间特征。模型只看当前帧 prior ->
  #   无 rollout 漂移 (没有反馈回路), 无 cold start (t=0 即可预测)。
  window: 0

  # ------------------------------------------------------------
  # 只保留有有效 prior 的通道。依据 fwv/diag_prior.py
  # (chunk 1-9, prior_ktuned, raw 空间, 跨 chunk 均值):
  #   通道    nRMSE_prior   corr     判定
  #   alpha      0.410      0.918    有效
  #   p_rgh      0.647      0.806    有效
  #   Ux         0.896      0.521    弱有效
  #   Uz         0.930      0.403    弱有效
  #   Uy         1.002     -0.001    无效 —— corr ~= 0, 比常数基线还差, prior 在加噪
  #   nut         --         --      FUNWAVE 无湍流模型, 结构上没有 prior
  # Uy / nut 在 1b 下必须 disabled: 它们没有可用 base, 而 1b 没有自反馈路径。
  #
  # alpha_weighted 全 false —— 单变量原则: 1b 已经改了通道数/时间建模/base,
  # 不再叠加空间变换。
  # αU 空间下 prior 匹配明显更好 (Ux 0.896->0.749 corr 0.52->0.71,
  # Uz 0.930->0.809 corr 0.40->0.66), 但那是因为 prior 空气区恒为 0 而 CFD
  # 气相有速度 —— 乘 alpha 把这块空间定义差异压掉, 是掩盖而非解决。
  # 作为第二个 arm 单独测: 只翻 Ux/Uz 的 alpha_weighted。
  # ------------------------------------------------------------
  channels:
    - {name: alpha, enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: Ux,    enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: Uy,    enabled: false}
    - {name: Uz,    enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: p_rgh, enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: nut,   enabled: false}

model:
  # ---- CFG 的两个 arm (单变量) ----
  # false = arm1: 输入 [prior | x_f*m], 2F 通道。屏蔽由 x_f*m 完成 (算术恒等),
  #         已是完整的 conditioning dropout。模型自己从"整帧 feedback 全零"
  #         这个签名推断当前是 cold start。
  # true  = arm2: 输入 [prior | x_f*m | m], 2F+1 通道。把"这次是屏蔽"直接告知,
  #         省下模型推断它的容量 —— 是效率, 不是必要性。
  # 先跑 arm1; 若 prior-only 那条通路表现不佳, 再开 arm2 单变量对照。
  mask_channel: false

  n_hidden: 128
  n_layers: 6
  n_heads: 8
  freq_num: 64
  dropout: 0.1
  mlp_ratio: 2
  spectral_pos_dim: 0
  use_ckpt: true

train:
  batch_size: 1
  lr: 5e-4
  weight_decay: 1e-4
  epochs: 50
  max_grad_norm: 1.0
  num_workers: 4
  # rollout_steps 仍不适用 —— teacher forcing 下没有反馈回路, R>1 等价扩 batch。
  # exposure bias 是下一个变量, 等这一轮基线稳了再动。

  # ---- conditioning dropout ----
  # 训练时以此概率把自反馈槽位整帧屏蔽 (x_f*m 置零 + mask 通道置 0),
  # 让模型在训练分布里就见过 "没有 feedback" 这种配置 -> 推理 t=0 不再陌生。
  #
  # 原论文 (Ho & Salimans 2022) 扫 {0.1, 0.2, 0.5}: 0.5 明显更差, 0.1/0.2 相当。
  # 但那里"无条件"是长期使用的推理模式, 你这里只有 t=0 一步用到 ——
  # regime 占比不同, 最优值未必落在 0.1-0.2。当超参扫, 别当定值。
  #
  # 注: 真 t=0 样本恒 m=0 (免费且分布最真实), 故实际 m=0 比例略高于此值。
  # 太小 -> cold start 配置见得太少, t=0 仍是 OOD
  # 太大 -> W_f 训练样本不足, feedback 支路退化成死重 (看 feedback gap ≈ 0)
  cond_dropout: 0.1

hydra:
  run:
    dir: outputs/${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

save:
  dir: ${hydra:runtime.output_dir}/checkpoints

wandb:
  enabled: true
  project: hpm-wave
  # 手动命名 (不走 autoname): fw 分支与现有 schema 消融不在同一命名空间。
  # fb = self-feedback 支路。与 hpm_fw_ktuned_h128 (无自反馈) 只差这一个变量,
  # 其余全同, wandb 里可直接叠图对照。
  name: hpm_fw_fb_arm1_h128