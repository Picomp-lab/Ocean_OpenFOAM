data:
  raw_dir: ../data
  processed_dir: ./processed_data
  x_min: -2.0
  x_max: 16.45
  z_min: -0.4
  z_max: 0.15
  nx: 4096
  nz: 128
  t_start: 10.0
  t_end: 50.0
  t_split: 45.0
  n_input_steps: 5
  input_channels:
  - 0
  - 1
  - 2
  n_input_ch: 16
  interp_method: linear
model:
  modes1: 128
  modes2: 32
  width: 64
  n_layers: 4
  n_out_ch: 3
train:
  epochs: 500
  batch_size: 4
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  step_size: 100
  gamma: 0.5
  physics_weight: 0.0
  data_weight: 1.0
  rollout_steps: 1
  rollout_weight: 1.0
  save_every: 50
  checkpoint_dir: ${hydra:runtime.output_dir}
  resume: null
logging:
  use_wandb: false
  project: pino-wave
  run_name: null
hardware:
  device: cuda
  num_workers: 4
  pin_memory: true
