data:
  dir: ${oc.env:HOME}/hpc-share/models/data/3d/cropped_0.05
  train_chunks: [1, 2, 3, 4, 5, 6, 7]
  val_chunks: [8, 9]
  window: 6

model:
  n_hidden: 64
  n_layers: 4
  n_heads: 8
  freq_num: 64
  dropout: 0.0
  mlp_ratio: 1
  spectral_pos_dim: 0
  use_ckpt: true
  use_phase_gate: true
  gate_alpha_0: 0.4
  gate_k_init: 40.0

train:
  batch_size: 1
  lr: 1e-4
  weight_decay: 1e-5
  epochs: 50
  max_grad_norm: 0.1
  num_workers: 4
  rollout_steps: 4

save:
  dir: ${hydra:runtime.output_dir}/checkpoints

wandb:
  enabled: true
  project: hpm-wave
  name: hpm_gated_a04_k40