[package]
name = "wave-demo"
version = "0.1.0"
edition = "2021"
description = "Interactive demo of the wave-field surrogate model -- pick the incident-wave conditions, submit the job to the OSU cluster, and get the results back"

[dependencies]
anyhow = "1"
axum = "0.8"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
    "io-util",
    "fs",
    "signal",
] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12.0.1"

[profile.release]
opt-level = 2
