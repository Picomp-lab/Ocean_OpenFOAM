# ============================================================
# config.yaml -- the single configuration file.
#
# The two model lines are distinguished by the single parameter data.window:
#   window == 0   HPM + FUNWAVE (fwv)   residual added on top of prior(t)   <- default, current main line
#   window >= 3   pure HPM              residual added on top of its own previous frame   earlier stage, finished
# The two are not freely combinable: only window>0 has history frames to use as a base,
# window=0 has none.
#
# ------------------------------------------------------------
# REPRODUCTION TABLE -- one line per run that was actually performed
# ------------------------------------------------------------
#  run name                  command
#  --------------------------------------------------------------------------
#  hpm_fw_aU_h128            python train.py
#      Default configuration = prior + self-feedback + SS(R=4) + alphaU weighting.
#      **Current best arm**. The criterion is the visualised result (nearshore shape),
#      not val nRMSE -- see "The alphaU comparison trap" below.
#
#  hpm_fw_h128               python train.py data.channels.1.alpha_weighted=false \
#                                            data.channels.3.alpha_weighted=false
#      Non-alphaU variant (velocity channels are not multiplied by alpha).
#
#  hpm_fw_nofb_h128          python train.py rollout.feedback=none rollout.R=1 \
#                                data.channels.1.alpha_weighted=false \
#                                data.channels.3.alpha_weighted=false
#      No-feedback baseline; a plain "prior field -> CFD field" single-step mapping, with
#      no rollout and no cold start.
#      (The branch that was actually run historically is the non-alphaU one, hence the
#       explicit disabling; for an alphaU version drop the last two lines and the name
#       becomes hpm_fw_nofb_aU_h128)
#
#  --- pure HPM line (earlier stage, no longer iterated) ---
#  Switching to it takes four groups of parameters (window / feedback / SS / channels):
#      data.window=6 rollout.feedback=none rollout.ss=false
#      data.channels.1.alpha_weighted=false data.channels.3.alpha_weighted=false
#      data.channels.2.enabled=true data.channels.5.enabled=true
#  That is the price of a single yaml, but it is explicit. run.sh already wraps it as
#  `./run.sh pure ...`, so there is no need to copy it by hand; forgetting rollout.ss=false
#  is caught by a build_policy assertion rather than silently running something else.
#    hpm_bl_h128       ./run.sh pure
#    nut frozen        ./run.sh pure data.channels.5.update_rule=frozen \
#                                    data.channels.5.loss_weight=0.0
#    nut disabled      ./run.sh pure data.channels.5.enabled=false
#
# ------------------------------------------------------------
# The alphaU comparison trap (read before reading any nRMSE)
# ------------------------------------------------------------
# alphaU and non-alphaU nRMSE values **do not live in the same space** and cannot be
# compared directly:
#   alphaU      stats_c1-7_alpha.Uxw.Uzw.p_rgh.npy   Delta=0 baseline for Ux is 0.619
#   non-alphaU  stats_c1-7_alpha.Ux.Uz.p_rgh.npy     Delta=0 baseline for Ux is 0.896
# The normalised quantity itself has changed (alphaUx vs Ux), so the denominators differ.
# That is exactly why the stats filename carries a 'w' suffix (schema.signature()).
# Cross-arm comparison is only valid on a metric in a shared space -- the raw-space
# slice-RMSE emitted by `vis.py pred`, or the nearshore shape region by region.
#
# Also note: the current config does not fix a random seed. Re-running the same
# configuration moves best_val by about 2% (measured: 0.1549 vs 0.1512), and the epoch at
# which the best appears shifts considerably.
#
# ------------------------------------------------------------
# Discipline: editing this file = **defining a new baseline**; run variants through CLI
# overrides.
#   A CLI override automatically enters the hydra directory name and the wandb run name
#   (override_dirname); editing the yaml does not -- so if rollout.R=4 and R=8 were both
#   done by editing the yaml, the two runs would end up with the same name.
# ------------------------------------------------------------
data:
  dir: ${repo:}/data/3d/cropped_0.05
  # Regenerated after per-chunk t-offset calibration
  # (toffset_scan/c00*.json -> gen_prior.sh).
  # best_k[1..9] = [1,3,5,5,4,3,2,4,6] -- not monotonic, so there is no "drift model" to
  # apply; it has to be calibrated chunk by chunk. Ignored when window>0 (pure HPM).
  prior_dir: ${repo:}/data/3d/cropped_0.05/prior_ktuned

  # chunk range: [single] or [start, end] (inclusive)
  # The prior for chunk 9 used to be ineffective (raw-space Uz nRMSE=1.02 > 1 under a fixed
  # offset). Per-chunk calibration found the optimum at k=+6 rather than +3 -- that was a
  # registration error, not a data problem. After regeneration Uz nRMSE=0.957 < 1, so
  # chunk 9 is now a valid test chunk.
  train_chunk_range: [1, 7]
  val_chunk_range: [8]
  test_chunk_range: [9]

  # 0 -> fwv line (base = prior);  >=3 -> pure HPM (base = last frame of the window,
  # requires finite differences)
  window: 0

  # ============================================================
  # Channel schema -- SINGLE SOURCE OF TRUTH (see schema.py).
  # The order here == the tensor channel order. Everything else is derived from it:
  # field_dim, out_dim, loss weights, alpha weighting, stats filename.
  #
  #   enabled:        false = the channel does not exist for the model at all (not an input,
  #                   no head, no stats, not counted in field_dim). 'alpha' cannot be
  #                   disabled.
  #   update_rule:    delta  = predicted by the delta head
  #                   frozen = still an input, carried through rollout unchanged, no head
  #                            and no loss
  #                   flux_div = reserved for a flux head, not implemented (raises
  #                            NotImplementedError)
  #   loss_weight:    per-channel MSE weight in z-normalized delta space (relative
  #                   importance, not a physical unit). Affects the gradient **and**
  #                   val_loss (hence the choice of best.pt).
  #                   Never combine update_rule=delta with loss_weight=0.0 -- an
  #                   unsupervised head will contaminate the rollout; use frozen or
  #                   enabled:false instead.
  #   alpha_weighted: multiplied by alpha (water volume fraction) in physical space
  #
  # The switch states below are for the fwv line. Channel selection follows diag_prior.py
  # (chunks 1-9, prior_ktuned, raw space, averaged across chunks):
  #   channel  nRMSE_prior   corr     verdict
  #   alpha       0.410      0.918    effective
  #   p_rgh       0.647      0.806    effective
  #   Ux          0.896      0.521    weakly effective
  #   Uz          0.930      0.403    weakly effective
  #   Uy          1.002     -0.001    ineffective -- corr~0, worse than a constant baseline;
  #                                   the prior is adding noise
  #   nut          --         --      FUNWAVE has no turbulence model, so structurally there
  #                                   is no prior
  #
  # alpha_weighted=true on Ux / Uz is the current best arm. It should be turned off when
  # running the pure HPM line (that line has no prior, so the motivation for alphaU does not
  # hold); the `pure` mode of run.sh already does this.
  # ============================================================
  channels:
    - {name: alpha, enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: Ux,    enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: true}
    - {name: Uy,    enabled: false, update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: Uz,    enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: true}
    - {name: p_rgh, enabled: true,  update_rule: delta, loss_weight: 1.0, alpha_weighted: false}
    - {name: nut,   enabled: false, update_rule: delta, loss_weight: 0.1, alpha_weighted: false}

# ------------------------------------------------------------
# rollout -- three variable axes (the base axis is derived from data.window and is not here)
# ------------------------------------------------------------
rollout:
  # none | self -- the self-feedback slot, supported on the fwv line only (the window of the
  # pure HPM line is already a state)
  #   none  input = [prior],         F channels
  #   self  input = [prior | x_f*m], 2F channels; masking is done by x_f*m (an arithmetic
  #         identity)
  feedback: self

  R: 4          # number of rollout steps (true BPTT; strictly ordered within a sequence,
                # random start point between sequences)

  # Master switch for scheduled sampling. false -> p is constantly 0 (fully autoregressive =
  # deployment condition), and the three p_* below are all ignored. The switch takes effect
  # exactly once, in train.py main.
  # The pure HPM line **must** use ss=false (its historical behaviour is to always feed pred);
  # build_policy asserts this, so setting data.window=6 while forgetting to turn it off fails
  # outright instead of silently producing wrong numbers.
  ss: true

  # Annealing parameters for SS (in effect only when ss=true). p = probability of feeding GT,
  # which treats exposure bias.
  #   p=1 teacher forcing (chain broken)   p=0 fully autoregressive = deployment condition
  #                                        (chain kept)
  # val is always p=0, matching deployment. p has no effect when R=1 (there is no step with
  # r>=1).
  p_start: 1.0
  p_end: 0.1
  anneal_frac: 0.6      # fraction of epochs spent annealing; <=0 means p_end throughout

model:
  n_hidden: 128
  n_layers: 6
  n_heads: 8
  freq_num: 64
  dropout: 0.1
  mlp_ratio: 2
  spectral_pos_dim: 0
  use_ckpt: true

train:
  batch_size: 1
  lr: 5e-4
  weight_decay: 1e-4
  # Note: 50 epochs x ~1780s ~= 24.7h, which hits the 24h SLURM wall (measured twice, both
  # stopped at epoch 47). The last 15 epochs are already flat, so 30 would finish without
  # losing anything -- not changed yet, still to be decided.
  epochs: 50
  max_grad_norm: 1.0
  num_workers: 4

hydra:
  job:
    config:
      # CLI overrides automatically enter the directory name and the wandb run name (an
      # automatic encoding of the hyperparameter diff).
      # Complementary to runname: runname covers the model line + schema diff, this covers
      # the hyperparameter diff.
      override_dirname:
        exclude_keys: [wandb.enabled, wandb.name, wandb.name_suffix,
                       train.num_workers]
        kv_sep: '-'
        item_sep: '_'
  run:
    dir: ${repo:}/results/train/${wandb.name}/${hydra.job.override_dirname}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${repo:}/results/train/${wandb.name}/${hydra.job.override_dirname}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

save:
  dir: ${hydra:runtime.output_dir}/checkpoints

wandb:
  enabled: true
  project: hpm-wave
  # The run name is derived automatically (train.py run_name):
  #   window>0 -> schema.auto_run_name    hpm_bl_h128 / hpm_no-nut_h128
  #   window=0 -> hpm_fw[_nofb][_aU|_aUx|_aUz]_h{n}
  #
  # The name encodes **only the diff against the default configuration**:
  #   nofb        self-feedback turned off (default is self)
  #   aU family   lists the velocity channels that are alpha-weighted -- same polarity as the
  #               pure HPM line (shown only when weighted):
  #                 Ux+Uz -> aU    Ux only -> aUx    Uz only -> aUz    neither -> omitted
  #   h{n}        model capacity, always present (a column meant for later cross-comparison;
  #               buried inside override_dirname it would be hard to spot)
  # Hyperparameters such as R / lr are not encoded here -- when set from the CLI,
  # override_dirname has already appended them, e.g. rollout.R=8 -> hpm_fw_aU_h128_rollout.R-8
  # Manual override: python train.py wandb.name=custom
  # Add a suffix:    python train.py wandb.name_suffix=lr5e4
  name: ${runname:}
  name_suffix: ""
